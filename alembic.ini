[alembic]
# Ledger 3.1 (review/2026-09-25-decision-ledger.md, Phase 3 row 3.1): Alembic
# governs the Postgres schema only. Local SQLite keeps its own additive-column
# migrations (unaffected by anything here).
script_location = migrations

# No sqlalchemy.url here on purpose: migrations/env.py builds the connection
# URL itself from the DATABASE_URL_DIRECT environment variable (Neon's
# non-pooler host) and refuses to run if it is unset. It never reads this ini
# file for a URL and never falls back to DATABASE_URL (the pooled endpoint) —
# see env.py's get_url() for why DDL must not go over the pooler.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
