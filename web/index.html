<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turtle AI — Personal assistant with voice and chat">
    <title>Turtle AI</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Component stylesheets -->
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/bubble.css">
    <link rel="stylesheet" href="/static/css/panel.css">
    <link rel="stylesheet" href="/static/css/input.css">
    <link rel="stylesheet" href="/static/css/devmode.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/memory.css">
</head>
<body>
    <div id="app">
        <!-- Main area: header + bubble + input -->
        <div class="chat-container">
            <!-- Connection Banner -->
            <div class="connection-banner" id="connection-banner">
                <span>Disconnected from server</span>
                <button class="reconnect-btn" id="btn-reconnect">Reconnect</button>
            </div>

            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <div class="turtle-logo-mark"><img src="/static/assets/turtle-icon.png" alt="Turtle" /></div>
                    <div class="header-title">
                        Turtle AI
                        <span class="header-subtitle" id="session-label">Personal Assistant</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="status-indicator" id="status-indicator" data-status="connecting">
                        <div class="status-dot"></div>
                        <span id="status-text">Connecting</span>
                    </div>
                    <button class="btn-icon" id="btn-memory-toggle" title="Memory" aria-label="Pending memories">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
                    </button>
                    <button class="btn-icon" id="btn-dev-toggle" title="Dev Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </header>

            <!-- Central Bubble Area -->
            <div class="bubble-container" id="bubble-container">
                <div class="bubble-glow" id="bubble-glow">
                    <div class="ambient-particle"></div>
                    <div class="ambient-particle"></div>
                    <div class="ambient-particle"></div>
                    <div class="bubble-orb" id="bubble-orb"
                         onmousedown="window._bubbleDown(event)"
                         onmouseup="window._bubbleUp(event)"
                         ontouchstart="window._bubbleDown(event)"
                         ontouchend="window._bubbleUp(event)">
                        <span class="bubble-mark"><img src="/static/assets/turtle-icon.png" alt="Turtle" /></span>
                    </div>
                </div>
                <div class="bubble-status" id="bubble-status">Ready</div>
            </div>

            <!-- Input Bar -->
            <div class="input-bar">
                <div class="input-wrapper">
                    <div class="input-field-wrap">
                        <textarea id="chat-input" rows="1" placeholder="Message Turtle AI..."></textarea>
                    </div>
                    <button class="btn-voice-mode" id="btn-voice-mode" type="button" title="Voice mode: Push-to-talk" aria-label="Toggle voice mode">
                        PTT
                    </button>
                    <button class="btn-voice" id="btn-voice" type="button" title="Start voice input" aria-label="Voice input" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3z"/>
                            <path d="M19 11a7 7 0 0 1-14 0"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                            <line x1="8" y1="22" x2="16" y2="22"/>
                        </svg>
                    </button>
                    <button class="btn-send" id="btn-send" disabled title="Send message">
                        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Response Panel (slides in from right) -->
        <div class="response-panel" id="response-panel">
            <div class="response-panel-header">
                <h3>Responses</h3>
                <button class="response-panel-close" id="btn-panel-close" title="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="response-messages" id="response-messages">
                <!-- Messages rendered here by chat.js -->
            </div>
            <div class="panel-thinking" id="panel-thinking">
                <div class="panel-thinking-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="panel-thinking-label" id="panel-thinking-label">Thinking</span>
            </div>
            <div class="panel-timing" id="panel-timing">
                <div class="panel-timing-item">
                    <span>LLM</span>
                    <span class="panel-timing-value" id="timing-llm">--</span>
                </div>
                <div class="panel-timing-item">
                    <span>STT</span>
                    <span class="panel-timing-value" id="timing-stt">--</span>
                </div>
                <div class="panel-timing-item">
                    <span>TTS</span>
                    <span class="panel-timing-value" id="timing-tts">--</span>
                </div>
                <div class="panel-timing-item">
                    <span>1st audio</span>
                    <span class="panel-timing-value" id="timing-ttfb">--</span>
                </div>
                <div class="panel-timing-item">
                    <span>Total</span>
                    <span class="panel-timing-value" id="timing-total">--</span>
                </div>
            </div>
        </div>

        <!-- Pending Memories Panel (slides in from right) -->
        <aside class="memory-panel" id="memory-panel">
            <div class="memory-panel-header">
                <h3>Memory</h3>
                <div class="memory-panel-actions">
                    <button class="btn-icon" id="btn-memory-refresh" title="Refresh">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                    <button class="btn-icon" id="btn-memory-close" title="Close">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="memory-tabs" role="tablist">
                <button class="memory-tab active" id="memory-tab-remembered" data-view="remembered" role="tab">What I remember</button>
                <button class="memory-tab" id="memory-tab-pending" data-view="pending" role="tab">To confirm<span class="memory-pending-badge" id="memory-pending-count"></span></button>
            </div>
            <div class="memory-panel-list" id="memory-remembered-list">
                <!-- Remembered profile rendered here by memory.js -->
            </div>
            <div class="memory-panel-list" id="memory-pending-list" style="display:none">
                <!-- Pending candidates rendered here by memory.js -->
            </div>
        </aside>

        <!-- Dev Mode Sidebar -->
        <aside class="dev-sidebar" id="dev-sidebar">
            <div class="dev-header">
                <h3>Dev Mode <span class="dev-badge">Beta</span></h3>
                <button class="btn-icon" id="btn-dev-close" title="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="dev-content">
                <div class="dev-section">
                    <div class="dev-section-title">Agent Models</div>
                    <div class="dev-field">
                        <label for="dev-main-agent-model">Main Assistant</label>
                        <select id="dev-main-agent-model"></select>
                    </div>
                    <div class="dev-field">
                        <label for="dev-email-agent-model">Email Specialist</label>
                        <select id="dev-email-agent-model"></select>
                    </div>
                </div>
                <div class="dev-section">
                    <div class="dev-section-title">All Agents (Runtime)</div>
                    <div id="dev-agents-list" class="dev-agents-list"></div>
                </div>
                <div class="dev-section">
                    <div class="dev-section-title">Model Fallbacks</div>
                    <div class="dev-field">
                        <label for="dev-openrouter-model">OpenRouter Primary</label>
                        <select id="dev-openrouter-model"></select>
                    </div>
                    <div class="dev-field">
                        <label for="dev-groq-model">Groq Primary</label>
                        <select id="dev-groq-model"></select>
                    </div>
                    <div class="dev-field">
                        <label for="dev-groq-fallback">Groq Fallback</label>
                        <select id="dev-groq-fallback"></select>
                    </div>
                </div>
                <div class="dev-section">
                    <div class="dev-section-title">Voice — TTS</div>
                    <div class="dev-field">
                        <label for="dev-deepgram-model">Deepgram TTS Model</label>
                        <select id="dev-deepgram-model"></select>
                    </div>
                    <div class="dev-field">
                        <label for="dev-tts-speed">Turtle Voice Speed <span id="dev-tts-speed-value">1.20x</span></label>
                        <input type="range" id="dev-tts-speed" min="0.7" max="1.5" step="0.05" value="1.2">
                    </div>
                    <div class="dev-field">
                        <label for="dev-groq-voice">Groq TTS Voice (fallback)</label>
                        <select id="dev-groq-voice"></select>
                    </div>
                </div>
                <div class="dev-section">
                    <div class="dev-section-title">Voice — STT</div>
                    <div class="dev-field">
                        <label for="dev-stt-model">Whisper Model (Groq)</label>
                        <select id="dev-stt-model"></select>
                    </div>
                </div>
                <div class="dev-section">
                    <div class="dev-section-title">Parameters</div>
                    <div class="dev-field">
                        <label for="dev-temperature">Temperature</label>
                        <input type="number" id="dev-temperature" min="0" max="2" step="0.1" value="0.2">
                    </div>
                    <div class="dev-field">
                        <label for="dev-max-tokens">Max Tokens</label>
                        <input type="number" id="dev-max-tokens" min="128" max="8192" step="128" value="1024">
                    </div>
                    <div class="dev-field">
                        <label for="dev-history-turns">History Turns</label>
                        <input type="number" id="dev-history-turns" min="2" max="50" step="1" value="12">
                    </div>
                    <div class="dev-field">
                        <label for="dev-max-messages">Max History Messages</label>
                        <input type="number" id="dev-max-messages" min="10" max="100" step="5" value="40">
                    </div>
                </div>
            </div>
            <div class="dev-actions">
                <button class="dev-btn" id="btn-reset-config">Reset Defaults</button>
                <button class="dev-btn primary" id="btn-apply-config">Apply Changes</button>
            </div>
        </aside>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Application JS (ES modules) -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
