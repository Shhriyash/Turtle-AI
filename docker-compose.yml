version: "3.8"

services:
  turtle-agent:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Deploy mode. The config alias is TURTLE_DEPLOY (core/config.py); the old
      # TURTLE_DEPLOY_MODE name was silently dropped (extra="ignore"), which left
      # compose deploys running in LOCAL mode — dev-anon honored, insecure
      # cookies, dev JWT fallback allowed. Use the real alias.
      - TURTLE_DEPLOY=cloud
      # Session-signing secret. NO default on purpose: a hardcoded fallback is a
      # public constant that lets anyone forge session cookies. ${VAR:?msg} makes
      # `docker compose up` fail loudly if it is unset.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set to a real secret}
      # Public base URL used to build magic links / forget-me links. Must be the
      # externally reachable URL of this deployment.
      - TURTLE_PUBLIC_BASE_URL=${TURTLE_PUBLIC_BASE_URL:?TURTLE_PUBLIC_BASE_URL must be set}
      # Admin dashboard gate (/admin, /admin/users, POST /api/config). Optional:
      # when unset the admin endpoints return 503 and config POST stays open.
      - TURTLE_ADMIN_TOKEN=${TURTLE_ADMIN_TOKEN}
      # --- LLM / STT / TTS / RAG providers -------------------------------------
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY2=${GROQ_API_KEY2}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPEN_ROUTER_API_KEY_1=${OPEN_ROUTER_API_KEY_1}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # --- Email (magic-link login, routine delivery, forget-me) ---------------
      - TURTLE_EMAIL_NAME=${TURTLE_EMAIL_NAME}
      - TURTLE_EMAIL_ADDRESS=${TURTLE_EMAIL_ADDRESS}
      - TURTLE_EMAIL_PASSKEY=${TURTLE_EMAIL_PASSKEY}
      # --- Optional monitoring -------------------------------------------------
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    restart: unless-stopped
