version: "3.8"

services:
  turtle-agent:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TURTLE_DEPLOY_MODE=cloud
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-dev-fallback-secret}
    restart: unless-stopped
