name: deploy-vercel

# The single, test-gated path to both production and preview deploys for
# this monolith. Triggered off the "tests" workflow's completion (same
# workflow_run pattern the old Azure deploy.yml used) rather than directly on
# push/pull_request, so a red test run can NEVER reach either environment —
# not "GitHub Actions ran deploy anyway", the deploy job's `if:` literally
# requires workflow_run.conclusion == 'success'.
#
# IMPORTANT — this is the ONLY deploy path. Vercel's own dashboard Git
# integration (if connected) would otherwise auto-deploy on every push/PR
# independent of this workflow, racing it and letting an untested commit
# reach production anyway — confirmed happening in practice on commit
# 5891bb1, where this workflow's probe failed and skipped `promote`, yet
# production served the new code anyway with a null build SHA (proof it
# was not this workflow's deploy). That hole is now closed in-repo:
# vercel.json sets `git.deploymentEnabled: false`, which turns off
# Git-triggered auto-deployment for every branch and leaves this workflow
# as the sole way anything reaches Vercel. This does not block the CLI path
# this workflow uses: on deploy-vercel run 36143665574 (deploy-preview, from
# commit 269a69f, which already carried the flag), `vercel deploy --token`
# still succeeded and produced a live preview
# (turtle-evmualrd4-sheshs-projects-3450851d.vercel.app), while Vercel's Git
# integration created zero deployments for that same commit (checked 3m32s
# after the push, versus a 34s baseline for a `vercel[bot]` Preview record
# on commit ac0ddf7 before this flag existed) — likely because the CLI/API
# path and the Git webhook are separate, though that internal mechanism
# isn't independently confirmed, just observed to hold here. Do not remove
# `git.deploymentEnabled` from vercel.json; doing so silently re-opens this
# race.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write   # only used by deploy-preview to comment the URL

jobs:
  deploy-production:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Ledger 3.1 (review/2026-09-25-decision-ledger.md, Phase 3): the ONLY
      # Python toolchain this workflow needs is for the Alembic migration
      # step immediately below — everything else here is Node/Vercel CLI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Alembic
        # requirements-migrations.txt (not requirements.txt): Alembic is
        # install-time-only tooling, never imported by the deployed app
        # itself — see that file's header for why it's kept out of the
        # manifest vercel.json bundles into production. This step does not
        # install the rest of requirements.txt (this job runs `alembic
        # upgrade head` only, not the app), so psycopg is installed
        # alongside it explicitly here; pip resolves a compatible SQLAlchemy
        # for Alembic automatically as its own declared dependency.
        run: pip install -r requirements-migrations.txt "psycopg[binary,pool]>=3.2"

      # Additive-first (ledger 3.1's "new columns and tables ship before the
      # code that uses them"): migrations run BEFORE the deploy below, so the
      # new schema exists before any new code that might read/write it goes
      # live, and so a broken migration blocks the deploy outright rather
      # than shipping code against a schema it doesn't match.
      #
      # DATABASE_URL_DIRECT is not set in the "production" GitHub environment
      # yet (ledger 3.1's owner action: "add DATABASE_URL_DIRECT to the
      # production GitHub environment"). This step deliberately does NOT skip
      # quietly when it's absent — migrations/env.py already fails loudly and
      # names the variable, and a silent skip here would let a schema-less
      # deploy proceed, which is the exact hazard ledger 3.1 exists to avoid.
      # Concretely: THIS STEP MAKES PRODUCTION DEPLOYS FAIL until the owner
      # sets DATABASE_URL_DIRECT as a secret on the "production" environment.
      # That is a deliberate, not an accidental, consequence of landing this
      # migration framework before the secret exists — flagged here rather
      # than engineered around.
      - name: Run database migrations (alembic upgrade head)
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_DIRECT:-}" ]; then
            echo "::error::DATABASE_URL_DIRECT is not set in the 'production' GitHub environment. Refusing to deploy without running migrations first — set this secret (Neon's direct, non-pooler connection string) to unblock deploys. See .env.example and migrations/env.py."
            exit 1
          fi
          alembic upgrade head

      # --skip-domain deploys without assigning the production domain, so a
      # deployment that fails the /healthz or /readyz probes below is never
      # user-visible and there is nothing to roll back. `vercel promote`
      # (below) is the only thing that ever completes the domain assignment,
      # and it only runs if this job reaches it — i.e. if every step above
      # succeeded (GitHub Actions aborts the job on the first failing step
      # unless a later step opts back in with `if: always()`/`if: failure()`,
      # which none of these do).
      - name: Deploy to production (without promoting)
        # No local `vercel pull` / `vercel build` step: building locally needs
        # `uv` on the runner's PATH, which actions/setup-python doesn't
        # provide, and fails with "uv is required but was not found in PATH"
        # (found the hard way on this workflow's first real run). `vercel
        # deploy --prod` without --prebuilt instead ships the source and lets
        # Vercel's own remote build environment (which does have uv) build
        # it — the same path a plain `vercel deploy --prod` from a developer
        # machine takes, and confirmed working that way already.
        id: deploy
        run: |
          set -euo pipefail
          # `tail -n1`: on a zero-exit deploy, `vercel deploy` prints the
          # deployment URL as its stdout, but a future CLI version could add
          # an extra informational line (an update notice, a warning) ahead
          # of it on the same zero-exit path. Without trimming, `url` would
          # become multi-line and `echo "url=$url" >> "$GITHUB_OUTPUT"` would
          # write invalid key=value syntax, breaking this step in a way
          # that's hard to read from the log. Keep only the last line.
          url=$(vercel deploy --prod --yes --skip-domain \
            --env TURTLE_BUILD_SHA="$BUILD_SHA" \
            --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production (unpromoted)"
            echo "- URL: $url"
            echo "- Build SHA: $BUILD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Asserts the deployment actually serves the commit this job checked
      # out, not a stale build. `vercel curl` attaches the protection-bypass
      # header so this unpromoted URL is reachable from CI. No `--fail` on
      # curl: we want the real body + status code back even on a non-200 so
      # the check below can report it, rather than have curl itself decide
      # pass/fail. If `vercel curl` fails outright (e.g. it cannot reach the
      # deployment at all), `response=$(...)` is a plain assignment, not a
      # condition (not inside `if`/`&&`/`||`/a negation, which are the actual
      # `set -e` exceptions) — so it is not exempt, and its non-zero exit
      # still trips `set -e` immediately. That failure mode is not
      # swallowed either.
      - name: Probe /healthz and assert deployed SHA
        id: healthz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          response=$(timeout 30 vercel curl /healthz \
            --deployment "$DEPLOY_URL" --yes \
            -- --silent --show-error --max-time 20 -w '\n%{http_code}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "::error::/healthz returned HTTP $http_code: $body"
            echo "- /healthz: FAILED (HTTP $http_code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          actual_sha=$(echo "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          if [ "$actual_sha" != "$BUILD_SHA" ]; then
            echo "::error::/healthz sha mismatch: expected $BUILD_SHA, got $actual_sha"
            echo "- /healthz: FAILED (sha mismatch: expected $BUILD_SHA got $actual_sha)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- /healthz: OK (sha=$actual_sha matches $BUILD_SHA)" >> "$GITHUB_STEP_SUMMARY"

      # Same non-swallowing reasoning as /healthz above: no `--fail` on curl,
      # so a 503 comes back as a normal response we inspect explicitly.
      #
      # Retries: on a brand-new deployment, /readyz is the FIRST database
      # call — it has to build the asyncpg pool AND wake a suspended Neon
      # compute (see core/storage/cloud/__init__.py's READYZ_TIMEOUT_S
      # comment). That is sometimes slower than even the raised 8s server
      # budget on a genuinely cold compute, which is transient, not a
      # backend fault (confirmed: a re-run of the same commit minutes later
      # passed, and warm production answers in 0.3-1.0s). So this loop
      # retries up to 5 times, 5s apart, succeeding on the first HTTP 200 and
      # failing the step only once every attempt has failed.
      #
      # Bash correctness: this step still runs under `set -euo pipefail`.
      # Inside the loop, `response=$(... ) || true` explicitly neutralises a
      # non-zero exit from the `vercel curl` pipeline (a plain assignment is
      # NOT a `set -e` exception — only `if`/`&&`/`||`/negated commands are —
      # so without the trailing `|| true` a single failed attempt would abort
      # the whole step instead of letting the loop retry).
      - name: Probe /readyz
        id: readyz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          max_attempts=5
          sleep_s=5
          succeeded=""
          for attempt in $(seq 1 "$max_attempts"); do
            response=$(timeout 30 vercel curl /readyz \
              --deployment "$DEPLOY_URL" --yes \
              -- --silent --show-error --max-time 20 -w '\n%{http_code}') || true
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" = "200" ]; then
              echo "$body"
              echo "- /readyz: OK (HTTP 200, attempt $attempt/$max_attempts)" >> "$GITHUB_STEP_SUMMARY"
              succeeded="1"
              break
            fi
            echo "attempt $attempt/$max_attempts: /readyz returned HTTP $http_code: $body"
            if [ "$attempt" != "$max_attempts" ]; then
              sleep "$sleep_s"
            fi
          done
          if [ -z "$succeeded" ]; then
            echo "$body"
            echo "::error::/readyz returned HTTP $http_code after $max_attempts attempts: $body"
            echo "- /readyz: FAILED after $max_attempts attempts (HTTP $http_code): $body" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Only reached if the deploy step succeeded AND both probes above
      # returned success (see the note on the deploy step). A failed check
      # never gets here, so there is nothing to roll back.
      - name: Promote to production domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel promote "$DEPLOY_URL" --token="$VERCEL_TOKEN" --yes
          echo "- Promoted to production: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy preview
        # See deploy-production's comment: no local pull/build step, since
        # `vercel build` needs `uv` on PATH and the runner doesn't have it.
        # Remote build (Vercel's own infra) does.
        id: deploy
        run: |
          set -euo pipefail
          # tail -n1: keep only the last stdout line in case a future CLI
          # version emits an extra line ahead of the URL on a zero-exit path
          # (see deploy-production's comment on the same pattern). This step
          # has no `shell:` key, so GitHub Actions' Linux default of
          # `bash -e {0}` applies, which does NOT set `-o pipefail` on its
          # own — without the explicit `set -euo pipefail` above, a failed
          # `vercel deploy` piped into `tail` would be masked (`tail` reads
          # empty input and exits 0), and this step would pass with an empty
          # `url`.
          url=$(vercel deploy --yes --env TURTLE_BUILD_SHA="$BUILD_SHA" --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Comment preview URL on the PR
        # workflow_run only carries pull_requests[] when the run and the PR
        # share the same repo (not for forks — GitHub withholds it there for
        # security). Skip quietly rather than fail when it's absent; the URL
        # is still in the job summary either way.
        if: ${{ github.event.workflow_run.pull_requests[0].number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "Preview deployed: $PREVIEW_URL"
