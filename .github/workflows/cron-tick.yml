name: cron-tick

# Vercel migration Phase 2: serverless has no persistent process to hold the
# local RoutineScheduler (core/routine_scheduler.py) in, so a periodic
# external trigger stands in for it — see apps/cron_tick_routes.py's module
# docstring for the full "why". This workflow is the trigger.
#
# GitHub Actions' `schedule` trigger is best-effort, not a clock: runs queue
# on shared runners, are delayed at peak times (the top of the hour), and are
# often dropped outright. Measured on this repo over 19 days only ~2% of the
# expected every-5-minute runs were delivered, with 2-8 hour gaps between them.
# So nothing here may assume a tick arrives every 5 minutes: the endpoint
# (apps/cron_tick_routes.py) remembers when it last ticked, enumerates every
# routine occurrence since then, fires the ones at most an hour late, and
# records older ones as missed. Each occurrence is claimed in Postgres
# (core/storage/cloud/routine_last_fired_store.py) so a doubled-up or retried
# run can never double-fire a routine.
#
# The odd minute offset (3-58/5 = :03, :08, ... :58) only avoids the
# top-of-hour peak; it does not fix the drop rate. `concurrency` queues rather
# than cancels an overlapping run (the endpoint's own lock makes an
# overlapping tick a no-op anyway).
concurrency:
  group: cron-tick
  cancel-in-progress: false

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}  # manual trigger for testing/debugging a stuck routine

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron-tick endpoint
        env:
          CRON_TICK_URL: ${{ secrets.CRON_TICK_URL }}
          CRON_TICK_SECRET: ${{ secrets.CRON_TICK_SECRET }}
        run: |
          if [ -z "$CRON_TICK_URL" ] || [ -z "$CRON_TICK_SECRET" ]; then
            echo "CRON_TICK_URL or CRON_TICK_SECRET secret is not set — skipping." >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/cron_tick_response.json -w "%{http_code}" \
            -X POST "$CRON_TICK_URL" \
            -H "Authorization: Bearer $CRON_TICK_SECRET")
          echo "HTTP status: $status"
          cat /tmp/cron_tick_response.json
          echo ""
          if [ "$status" -ge 300 ]; then
            echo "cron-tick request failed with status $status" >&2
            exit 1
          fi
