name: cron-tick

# Vercel migration Phase 2: serverless has no persistent process to hold the
# local RoutineScheduler (core/routine_scheduler.py) in, so a periodic
# external trigger stands in for it — see apps/cron_tick_routes.py's module
# docstring for the full "why". This workflow is the trigger.
#
# GitHub Actions' `schedule` cron does not guarantee to-the-minute execution,
# and in this repo it has not come close: over the workflow's first 5 days it
# delivered 34 of ~1484 `*/5` runs (2.2%), median gap 220 minutes, never once
# under 115. This is still the most frequent trigger available on the current
# Vercel plan (whose crons are daily-only — see vercel.json's `crons`, the
# once-a-day floor under this workflow), so `*/5` stays: it asks for far more
# than it gets, and what it gets is roughly every 2-4 hours.
#
# That is survivable because apps/cron_tick_routes.py fires everything that
# came due since its last tick (a cursor in Postgres,
# core/storage/cloud/cron_tick_cursor_store.py) rather than only what is due
# this instant, and de-dupes each scheduled occurrence
# (core/storage/cloud/routine_last_fired_store.py) — so a late, doubled-up or
# overlapping run can neither miss nor double-fire a routine. Late, not lost.
# If routines need to land closer to their scheduled minute than "within a
# few hours", the fix is a punctual external caller (any uptime pinger can
# POST or GET this endpoint), not a smaller number in the cron below.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # manual trigger for testing/debugging a stuck routine

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron-tick endpoint
        env:
          CRON_TICK_URL: ${{ secrets.CRON_TICK_URL }}
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          if [ -z "$CRON_TICK_URL" ] || [ -z "$CRON_SHARED_SECRET" ]; then
            echo "CRON_TICK_URL or CRON_SHARED_SECRET secret is not set — skipping." >&2
            exit 1
          fi
          status=$(curl -sS -o /tmp/cron_tick_response.json -w "%{http_code}" \
            -X POST "$CRON_TICK_URL" \
            -H "Authorization: Bearer $CRON_SHARED_SECRET")
          echo "HTTP status: $status"
          cat /tmp/cron_tick_response.json
          echo ""
          if [ "$status" -ge 300 ]; then
            echo "cron-tick request failed with status $status" >&2
            exit 1
          fi
