[pytest]
# Disable pytest cache provider to stop writing .pytest_cache state.
addopts = -p no:cacheprovider --basetemp=output/pytest_tmp

# Registered so `-m cloud` / collection doesn't warn about an unknown mark.
# test/cloud_integration/ tests run real SQL/Redis against a real Postgres +
# Redis (TURTLE_DEPLOY=cloud) and self-skip when DATABASE_URL/REDIS_URL are
# unset (see test/cloud_integration/conftest.py) — see the cloud-tests CI job.
markers =
    cloud: needs a live Postgres (DATABASE_URL) and Redis (REDIS_URL)

# Keep pytest away from virtualenvs and corrupted cache folders.
norecursedirs =
    venv
    .venv
    pytest-cache-files-*

# Remove temp dirs created by tmp_path fixtures after each run.
tmp_path_retention_policy = none
tmp_path_retention_count = 0