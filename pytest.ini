[pytest]
# Disable pytest cache provider to stop writing .pytest_cache state.
addopts = -p no:cacheprovider --basetemp=output/pytest_tmp

# Keep pytest away from virtualenvs and corrupted cache folders.
norecursedirs =
    venv
    .venv
    pytest-cache-files-*

# Remove temp dirs created by tmp_path fixtures after each run.
tmp_path_retention_policy = none
tmp_path_retention_count = 0